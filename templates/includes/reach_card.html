<div class="hero-card hero-card--reach">
  <p class="eyebrow">Reach Us</p>
  <div class="reach-list">
    <div class="reach-item">
      <p class="reach-label">Call</p>
      <p class="reach-value">{{ fs.phone }}</p>
      <a class="reach-link" href="{{ fs.phone_href }}">Call the farm &rarr;</a>
    </div>
    <div class="reach-item">
      <p class="reach-label">Email</p>
      <p class="reach-value">{{ fs.email }}</p>
      <a class="reach-link" href="mailto:{{ fs.email }}">Send an email &rarr;</a>
    </div>
    <div class="reach-item">
      <p class="reach-label">Visit</p>
      <p class="reach-value">{{ fs.location }}</p>
      <a class="reach-link" href="https://www.google.com/maps/search/?api=1&amp;query={{ fs.location|urlencode }}" target="_blank" rel="noopener">See map &rarr;</a>
    </div>
  </div>
</div>
