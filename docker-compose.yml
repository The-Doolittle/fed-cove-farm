services:
  web:
    build: .
    image: fed-cove-farm
    env_file: .env
    ports:
      - "${PORT:-8020}:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Background jobs: Google Calendar pull + Hotplate menu refresh.
  worker:
    image: fed-cove-farm
    env_file: .env
    command: ["python", "manage.py", "run_worker"]
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on:
      - web
    restart: unless-stopped
